name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libfontconfig-dev \
            libegl-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb1-dev \
            libvulkan-dev \
            libssl-dev \
            libsqlite3-dev \
            mesa-vulkan-drivers \
            vulkan-tools

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check workspace
        run: cargo check --workspace

      - name: Lock-phase consistency checks
        if: runner.os == 'Linux'
        run: |
          cargo run -q -p lock-checks -- check-stubs
          # Regenerate the platform-imports survey and fail on drift.
          cargo run -q -p lock-checks -- check-platform-imports > /tmp/live-platform-imports.md
          diff -u docs/reports/platform-imports.md /tmp/live-platform-imports.md \
            || { echo; echo 'ERROR: platform-imports drift detected. Run:'; \
                 echo '  cargo run -q -p lock-checks -- check-platform-imports --emit'; \
                 echo 'and commit the updated docs/reports/platform-imports.md.'; \
                 exit 1; }

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libfontconfig-dev \
            libegl-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb1-dev \
            libvulkan-dev \
            libssl-dev \
            libsqlite3-dev \
            mesa-vulkan-drivers \
            vulkan-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libfontconfig-dev \
            libegl-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb1-dev \
            libvulkan-dev \
            libssl-dev \
            libsqlite3-dev \
            mesa-vulkan-drivers \
            vulkan-tools

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Vulkan diagnostic (Linux)
        if: runner.os == 'Linux'
        run: |
          # Discover where mesa-vulkan-drivers actually installs ICDs.
          # The loader auto-discovers any ICD JSON in /usr/share/vulkan/icd.d/
          # and /etc/vulkan/icd.d/, so we let that work rather than hardcoding.
          dpkg -L mesa-vulkan-drivers 2>/dev/null | grep -E '\.json$' || true
          ls -la /usr/share/vulkan/icd.d/ 2>/dev/null || true
          vulkaninfo --summary
          vulkaninfo --summary | grep -q -i 'llvmpipe\|lavapipe' \
            || { echo 'lavapipe not detected — check mesa-vulkan-drivers install'; exit 1; }

      - name: Test
        run: cargo test --workspace

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
