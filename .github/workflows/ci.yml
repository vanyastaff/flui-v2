name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

# K99 — MSRV gate notes:
#
# rust-toolchain.toml at repo root pins the channel to the workspace MSRV
# (currently 1.95). All jobs below using `dtolnay/rust-toolchain@stable`
# will respect that pin (the action defers to rust-toolchain.toml when it
# exists), so the standard check/clippy/test/format jobs ARE the MSRV gate.
#
# The `forward-compat` job below explicitly bypasses rust-toolchain.toml
# via `rustup default stable && rustup update` to detect regressions on
# Rust versions newer than MSRV. It's allowed to fail (continue-on-error)
# — it's an early-warning radar, not a blocking gate.

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libfontconfig-dev \
            libegl-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb1-dev \
            libvulkan-dev \
            libssl-dev \
            libsqlite3-dev \
            mesa-vulkan-drivers \
            vulkan-tools

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check workspace
        run: cargo check --workspace

      - name: Lock-phase consistency checks
        if: runner.os == 'Linux'
        run: |
          cargo run -q -p lock-checks -- check-stubs
          # Regenerate the platform-imports survey and fail on drift.
          cargo run -q -p lock-checks -- check-platform-imports > /tmp/live-platform-imports.md
          diff -u docs/reports/platform-imports.md /tmp/live-platform-imports.md \
            || { echo; echo 'ERROR: platform-imports drift detected. Run:'; \
                 echo '  cargo run -q -p lock-checks -- check-platform-imports --emit'; \
                 echo 'and commit the updated docs/reports/platform-imports.md.'; \
                 exit 1; }

  check-windows-test-support:
    name: Check test-support on Windows (S07.5 T1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Locks the test-support feature decoupling from S07.5 T1: test-support
      # must build on Windows without wayland/x11. See
      # `.ai-factory/plans/feature-gesture-s07-t15-followup.md`.
      - name: cargo check -p flui-core --features test-support
        run: cargo check -p flui-core --features test-support
      # Run the gesture-dispatch integration tests on Windows too —
      # they are platform-agnostic by design (the whole point of the
      # T1 feature split was to make them buildable on this runner).
      - name: cargo test -p flui-core --features test-support --test gesture_dispatch_integration
        run: cargo test -p flui-core --features test-support --test gesture_dispatch_integration
      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack
      # Smoke the new feature combinatorics — depth 2 catches the test-support /
      # test-support-with-platform pair without exploding into a full powerset.
      - name: cargo hack feature-powerset (test-support family)
        run: cargo hack check -p flui-core --feature-powerset --depth 2 --features test-support

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libfontconfig-dev \
            libegl-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb1-dev \
            libvulkan-dev \
            libssl-dev \
            libsqlite3-dev \
            mesa-vulkan-drivers \
            vulkan-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libfontconfig-dev \
            libegl-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb1-dev \
            libvulkan-dev \
            libssl-dev \
            libsqlite3-dev \
            mesa-vulkan-drivers \
            vulkan-tools

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Vulkan diagnostic (Linux)
        if: runner.os == 'Linux'
        run: |
          # Discover where mesa-vulkan-drivers actually installs ICDs.
          # The loader auto-discovers any ICD JSON in /usr/share/vulkan/icd.d/
          # and /etc/vulkan/icd.d/, so we let that work rather than hardcoding.
          dpkg -L mesa-vulkan-drivers 2>/dev/null | grep -E '\.json$' || true
          ls -la /usr/share/vulkan/icd.d/ 2>/dev/null || true
          vulkaninfo --summary
          vulkaninfo --summary | grep -q -i 'llvmpipe\|lavapipe' \
            || { echo 'lavapipe not detected — check mesa-vulkan-drivers install'; exit 1; }

      - name: Test
        run: cargo test --workspace

      # S07.5 T10 — the gesture-dispatch integration tests are
      # cfg-gated on the `test-support` feature (which is not in the
      # default feature set), so the workspace `cargo test` above does
      # not pick them up. Run them explicitly so the
      # paint → register_recognizer → arena.dispatch → callback
      # chain stays locked in CI.
      - name: Test flui-core with test-support feature (gesture e2e)
        run: cargo test -p flui-core --features test-support --test gesture_dispatch_integration

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  forward-compat:
    name: Forward-compat (latest stable, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libfontconfig-dev \
            libegl-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb1-dev \
            libvulkan-dev \
            libssl-dev \
            libsqlite3-dev

      # Bypass rust-toolchain.toml (which pins the MSRV) and use the
      # latest stable Rust as a forward-compat radar. If a deprecation,
      # new lint, or behaviour change in a newer Rust would land before
      # the next MSRV bump, this job surfaces it early.
      #
      # Note: `rustup default stable` alone is NOT enough — the repo-local
      # rust-toolchain.toml takes precedence over the rustup global default
      # whenever cargo is invoked from inside the repo. To actually run
      # latest stable we set RUSTUP_TOOLCHAIN=stable for the cargo step,
      # which overrides rust-toolchain.toml.
      - name: Install latest stable
        run: |
          rustup update stable
          rustup run stable rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: Check workspace on latest stable
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          # Confirm the override actually applied — should print latest stable,
          # not the version pinned in rust-toolchain.toml.
          rustc --version
          cargo check --workspace
