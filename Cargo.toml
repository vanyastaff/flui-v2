[workspace]
members = [
    "crates/flui-core",
    "crates/flui-macros",
    "crates/flui-widgets",
    "crates/flui-animate",
    "crates/flui-navigator",
    "crates/flui-a11y",
    "crates/flui-theme",
    "crates/flui-material",
    "examples/nav_demo",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
authors = ["Vanya Staff"]
license = "Apache-2.0"
repository = "https://github.com/vanyastaff/flui-v2"

[profile.dev]
split-debuginfo = "unpacked"
incremental = false
codegen-units = 16

[profile.dev.build-override]
codegen-units = 16

[profile.dev.package]
quote = { opt-level = 3 }
syn = { opt-level = 3 }
proc-macro2 = { opt-level = 3 }
taffy = { opt-level = 3 }
resvg = { opt-level = 3 }

[profile.release]
debug = "limited"
lto = "thin"
codegen-units = 1

[profile.release-fast]
inherits = "release"
debug = "full"
lto = false
codegen-units = 16

[workspace.lints.rust]
unexpected_cfgs = { level = "allow" }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "allow"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
