# Overlay для docs/research/flutter-issues.md.
# Заполняется вручную; скрипт scripts/fetch-flutter-issues.sh подмешивает
# поля в колонки `ADR?`, `Reproduced in flui-v2?`, `Notes`.
#
# Значения:
#   adr:   yes | maybe | no | n-a
#   repro: yes | partial | no | unknown | n-a
#   notes: короткая заметка.
#
# Большинство issues здесь — material для cross-walk (см.
# docs/research/flutter-cross-walk.md). Triage точнее в самом cross-walk
# документе; overlay даёт ту же информацию в табличной форме.
#
# Ключи — номера issue в flutter/flutter.

